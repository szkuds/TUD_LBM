# TUD-LBM MRT Single-Phase Configuration

[simulation_type]
simulation_name = "mrt_test"
type            = "single_phase"
grid_shape      = [100, 100]
lattice_type    = "D2Q9"
tau             = 1.0
nt              = 10000
save_interval   = 1000
init_type       = "standard"
collision_scheme = "mrt"
w

[output]
results_dir  = "~/TUD_LBM_data/example_results"
save_fields  = ["rho", "u"]
plot_fields = ["density", "velocity"]
