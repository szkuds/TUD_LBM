# ── Carnahan-Starling EOS — example config ──────────────────────────────────
#
# Purpose: an end-to-end example of the CS EOS path through the full
# pipeline (config load → build_setup → init_state → run).
#
# Grid: 201×201 with one vapour bubble of radius 0.3·201 (vapour is the
# default dispersed phase).
# Physics: not a calibrated physical case. CS has no closed-form surface
# tension; `tud-lbm calibration stage` measures it for this fluid.
#
# interface_width is a required field for every multiphase run; for CS it
# sets the tanh initialisation profile only and has no effect on the
# macroscopic operator. rho_l/rho_v may be omitted: they are then the
# Maxwell coexistence pair of a_eos, b_eos, r_eos and t_eos.

[simulation_type]
simulation_name   = "cs_eos_test"
lattice_type      = "D2Q9"
grid_shape        = [201, 201]
nt                = 50000
tau               = 0.99
collision_scheme  = "bgk"
init_type         = "multiphase_bubbles"

[multiphase]
eos             = "carnahan-starling"
kappa           = 0.01
rho_l           = 12.18
rho_v           = 0.015
interface_width = 5      # initialisation hint only — unused by CS operator

# Carnahan-Starling EOS parameters
a_eos = 0.00031459670905604266
b_eos = 0.1490857142857143
r_eos = 1.0
t_eos = 0.00039808421247983624

[initialisation]
# Single bubble centred in the domain, radius = 0.3 * min(nx, ny)
centres = [[0.5, 0.5]]
radii   = [0.3]

[output]
results_dir = "~/TUD_LBM_data/example_results"
save_interval = 500
save_fields   = ["rho", "u"]
plot_fields = ["density", "velocity"]
