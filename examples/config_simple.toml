# TUD-LBM Simple Single-Phase Simulation Configuration
#
# Run it from the command line:
#
#   tud-lbm run examples/config_simple.toml
#
# or load it via the TOML adapter (see example_run_simple.py):
#
#   from src import build_setup, init_state, run
#   from src.config.adapter_toml import TomlAdapter
#
#   config = TomlAdapter().load("examples/config_simple.toml")
#   setup  = build_setup(config)
#   state  = init_state(setup)
#   final_state, trajectory = run(setup, state)

[simulation_type]
simulation_name = 'Test simple simulation'
grid_shape = [100, 100, 1]
lattice_type = "D2Q9"
tau = 0.6
nt = 101
save_interval = 100
init_type = "standard"

[output]
results_dir = "~/TUD_LBM_data/example_results"
save_fields = ["rho", "u"]
plot_fields = ["density"]

