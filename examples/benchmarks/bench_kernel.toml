# Case A — bandwidth-bound LBM kernel.
#
# Plain multiphase: no wetting, no hysteresis, all-periodic boundaries. Dense
# stencil work, no data-dependent control flow, no host interaction — the best
# case for a GPU. If a GPU does not win here it will not win anywhere.
#
# Sweep the grid by hand, one benchmark per size, to find the crossover point
# where the GPU overtakes the CPU:
#
#   tud-lbm benchmark examples/benchmarks/bench_kernel.toml \
#       --override grid_shape=[128,128]  --label kernel_128
#   ... 256, 512, 1024 (and 2048 on GPU only)
#
# `nt` is irrelevant here — `--steps` sets the measured scan length.

[simulation_type]
simulation_name = "bench_kernel"
type = "multiphase"
grid_shape = [256, 256]
lattice_type = "D2Q9"
tau = 0.99
nt = 1000
init_type = "multiphase_bubbles"

[initialisation]
centres = [[0.5, 0.5]]
radii = [0.3]

[multiphase]
kappa = 0.017
rho_l = 1.0
rho_v = 0.33
interface_width = 5
eos = "double-well"

[gravity_force]
force_g = 0
inclination_angle_deg = 90

# No plot_fields: figure generation must never be reachable from a timed path.
# results_dir matches the TUD_LBM_DATA_DIR default; it is spelled out because
# scripts/db_new_job.sh rewrites this key when staging a DelftBlue job and
# errors if it is absent.
[output]
results_dir = "~/TUD_LBM_data"
save_fields = ["rho", "u"]
