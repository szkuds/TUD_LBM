[simulation_type]
simulation_name = "Test chemical step simulation"
lattice_type = "D2Q9"
grid_shape = [
    201,
    101,
    1,
]
nt = 20000
tau = 0.99
collision_scheme = "bgk"
init_type = "multiphase_bubbles"
init_dir = "/Users/sbszkudlarek/TUD_LBM_data/chem_step_test/2026-05-04/13-30-21_Test chemical step simulation/data/timestep_12000.npz"
skip_interval = 1
type = "multiphase_hysteresis_chemical_step"

[boundary_conditions]
left = "periodic"
right = "periodic"
top = "bounce-back"
bottom = "wetting"
front = "periodic"
back = "periodic"

[chemical_step]
chemical_step_location = 0.5
chemical_step_edge = "bottom"
ca_advancing_pre_step = 120.0
ca_receding_pre_step = 100.0
phi_pre_step = 1.0
d_rho_pre_step = 0.05
ca_advancing_post_step = 70.0
ca_receding_post_step = 50.0
phi_post_step = 1.2
d_rho_post_step = 0.0

[gravity_masked_force]
force_g = 1e-06
inclination_angle_deg = 60

[hysteresis]
learning_rate = 0.05
max_iterations = 10

[initialisation]
centres = [
    [
        0.3,
        0,
    ],
]
radii = [
    0.3,
]
dispersed = "liquid"

[multiphase]
eos = "double-well"
kappa = 0.04
rho_l = 1.0
rho_v = 0.001
interface_width = 5

[output]
results_dir = "/Users/sbszkudlarek/TUD_LBM_data/chem_step_test"
save_fields = [
    "rho",
    "u",
]
plot_fields = [
    "density",
    "velocity",
]
output_format = "numpy"

[wetting]
phi_left = 1.0
phi_right = 1.0
d_rho_left = 0.05
d_rho_right = 0.05
