[simulation_type]
simulation_name = "multiphase_hysteresis_chemical_step"
lattice_type = "D2Q9"
grid_shape = [
    256,
    64,
    1,
]
nt = 500
tau = 0.99
collision_scheme = "bgk"
init_type = "multiphase_bubbles"
save_interval = 50
skip_interval = 0
type = "multiphase_hysteresis_chemical_step"

[boundary_conditions]
left = "periodic"
right = "periodic"
top = "bounce-back"
bottom = "wetting"

[chemical_step]
edge_width = 1.0
chemical_step_location = 0.5
chemical_step_edge = "bottom"
ca_advancing_pre_step = 120.0
ca_receding_pre_step = 100.0
ca_advancing_post_step = 70.0
ca_receding_post_step = 50.0

[gravity_masked_force]
inclination_angle_deg = 60
ramp_start_t = 0.0
force_g = 1e-06

[hysteresis]
learning_rate = 0.01
learning_rate_above = 0.05
max_iterations = 5
loss_tol = 0.0001
trial_steps = 2
saturation_gap = 1.0
max_iterations_above = 5

[initialisation]
centres = [
    [
        0.23,
        0,
    ],
]
radii = [
    0.5,
]
dispersed = "liquid"

[multiphase]
eos = "double-well"
kappa = 0.017
rho_l = 1.0
rho_v = 0.001
interface_width = 5

[output]
results_dir = "/Users/sbszkudlarek/TUD_LBM_data/test_runs"
save_fields = [
    "f",
    "rho",
    "u",
]
plot_fields = [
    "density",
    "velocity",
    "contact_angles_pair",
    "contact_line_speeds_pair",
]
output_format = "numpy"

[wetting]
phi_left = 1.0
phi_right = 1.0
d_rho_left = 0.0
d_rho_right = 0.0
