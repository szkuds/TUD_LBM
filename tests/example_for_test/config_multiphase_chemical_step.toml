# Test config for step_multiphase_hysteresis_chemical_step
# Triggers: sim_type="multiphase" + [hysteresis] + [chemical_step]
# Hysteresis window is spatially varying: pre/post step angles differ across the step location.

[simulation_type]
simulation_name = "test_multiphase_hysteresis_chemical_step"
type = "multiphase_hysteresis_chemical_step"
grid_shape = [256, 64]
lattice_type = "D2Q9"
tau = 0.99
nt = 500
init_type = "multiphase_bubbles"

[initialisation]
centres = [[0.23, 0]]
radii = [0.5]
dispersed = "liquid"

[multiphase]
kappa = 0.017
rho_l = 1.0
rho_v = 0.33
interface_width = 4
eos = "double-well"

[boundary_conditions]
left = "periodic"
right = "periodic"
top = "bounce-back"
bottom = "wetting"

[hysteresis]
learning_rate = 0.01
max_iterations = 5

[chemical_step]
chemical_step_location = 0.5
chemical_step_edge = "bottom"
ca_advancing_pre_step = 120.0
ca_receding_pre_step = 100.0
ca_advancing_post_step = 70.0
ca_receding_post_step = 50.0

[gravity_masked_force]
force_g = 5e-06
inclination_angle_deg = 60

[output]
results_dir = "~/TUD_LBM_data/test_runs"
save_fields = ["rho", "u"]
plot_fields = ["density", "velocity", "contact_angles_pair", "contact_line_speeds_pair"]
