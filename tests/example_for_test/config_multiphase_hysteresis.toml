# Test config for step_multiphase_hysteresis
# Triggers: sim_type="multiphase" + [wetting] + [hysteresis], no [chemical_step]
# Wetting params are updated each step by the hysteresis optimiser.

[simulation_type]
simulation_name = "test_multiphase_hysteresis"
type = "multiphase_hysteresis"
grid_shape = [256, 64]
lattice_type = "D2Q9"
tau = 0.99
nt = 5000
init_type = "multiphase_bubbles"
#init_type = "init_from_file"
#init_dir = "/Users/sbszkudlarek/TUD_LBM_data/test_runs/2026-05-08/23-42-16_test_multiphase_hysteresis/data/timestep_1000.npz"

[initialisation]
centres = [[0.5, 0.0]]
radii = [0.5]
dispersed = "liquid"

[multiphase]
kappa = 0.017
rho_l = 1.0
rho_v = 0.33
interface_width = 4
eos = "double-well"

[boundary_conditions]
left = "periodic"
right = "periodic"
top = "bounce-back"
bottom = "wetting"

[wetting]
phi_left = 1.0
phi_right = 1.0
d_rho_left = 0.0
d_rho_right = 0.0

[hysteresis]
ca_advancing = 120.0
ca_receding = 60.0
learning_rate = 0.01
max_iterations = 10

[gravity_masked_force]
force_g = 5e-06
inclination_angle_deg = 60

[output]
results_dir = "~/TUD_LBM_data/test_runs"
save_fields = ["rho", "u"]
plot_fields = ["density", "velocity", "contact_angles_pair", "contact_line_speeds_pair"]
