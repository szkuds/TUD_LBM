# see documentation, e.g.
# - https://packaging.python.org/en/latest/specifications/declaring-project-metadata/#declaring-project-metadata
# - https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
# - https://www.python.org/dev/peps/pep-0621/

[build-system]
requires = ["setuptools>=64.0.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "Sacha Szkudlarek", email = "s.b.szkudlarek@tudelft.nl" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # Core runtime — previously managed via environment.yml
  "jax[cpu]",
  "jax",
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "optax",
  "tomli-w",       # PyPI name uses a dash, not an underscore
  "pyevtk",
  # CLI
  "click",
  "rich",
]
description = "This is a lattice Boltzmann method package developed at Delft University of Technology."
keywords = ["LBM", "TUD", "Delft University of Technology"]
license = { file = "LICENSE" }
name = "tud_lbm"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
version = "2026.0.1"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "ruff",
  "python-dotenv",
  "ty",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "myst-parser",
  "sphinx-autoapi",
  "pandoc",
  # jax[cpu] is already a core dep — listed here for clarity/standalone doc installs
  "jax[cpu]",
]
animation = ["moviepy"]
publishing = ["build", "twine"]

[project.urls]
Repository = "https://github.com/szkuds/tud_lbm"
Issues     = "https://github.com/szkuds/tud_lbm/issues"
ReadTheDocs = "https://tud_lbm.readthedocs.io"

[project.scripts]
tud-lbm = "tud_lbm.cli.cli:cli"

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
# Use the lockfile for reproducible installs; uv will create uv.lock on first run.
# Override jax to CPU-only in CI — GPU builds are only needed locally.
# If you need GPU support locally, run:  uv sync --extra dev --override jax[cuda12]
package = true

# ---------------------------------------------------------------------------
# setuptools
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: Integration tests that validate end-to-end physics pipelines",
  "unit: Unit tests for individual operators",
  "conformance: Tests that verify operators satisfy protocol contracts",
  "slow: Full-pipeline smoke tests (run with -m slow or on schedule, not in fast CI)",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["tud_lbm"]
command_line = "-m pytest"

# ---------------------------------------------------------------------------
# tox (kept for legacy compatibility; prefer uv run in CI)
# ---------------------------------------------------------------------------
[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311,py312,py313,py314
skip_missing_interpreters = true
[testenv]
commands = pytest
extras = dev
"""

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
output-format = "concise"
extend-exclude = ["docs"]

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = ["ALL"]
ignore = [
  "ANN204",
  "ANN205",
  "FBT",
  "TD",
  "FIX001",
  "FIX002",
  "PLR0913",
  "PLC0415",
  "COM812",
  "RUF002",
    "RUF001",
]
pydocstyle.convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["array_field"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "ANN201","PT011","S101","SLF001","INP001","S108","ANN001","D103",
  "PLC0415","ARG001","PLR2004","D102","ARG004","ARG003","ANN202",
  "ANN002","ANN003","ARG005","ARG002","RUF002","RUF003","D100",
  "D104","D205","PLR0913","TRY300",
]
"examples/**.py"                                  = ["INP001","ANN201","ERA001","T201","D103"]
"examples/minimal_example.py"                     = ["RUF002"]
"tud_lbm/config/simulation_config.py"             = ["RUF009"]
"tud_lbm/util/plotting/__init__.py"               = ["I001"]
"tud_lbm/util/plotting/base.py"                   = ["ARG002"]
"tud_lbm/pipeline/setup.py"                       = ["PLC0415","RUF002"]
"tud_lbm/pipeline/__init__.py"                    = ["PLC0415"]
"tud_lbm/runner/parallel_runner.py"               = ["PLC0415","ARG001","LOG015","G004"]
"tud_lbm/operators/protocols.py"                  = ["ANN401","RUF002"]
"tud_lbm/operators/macroscopic/_multiphase.py"    = ["RUF002","RUF003"]
"tud_lbm/operators/collision/_bgk.py"             = ["RUF002"]
"tud_lbm/util/io.py"                              = ["ANN002"]
"tud_lbm/pipeline/**"                             = ["T201"]
"tud_lbm/operators/wetting/hysteresis/hysteresis.py" = ["C901", "PLR0915"]
"tud_lbm/io/plotting/run_comparison.py"   = ["T201"]
"tud_lbm/io/plotting/simulation_csv.py"   = ["T201"]
"tud_lbm/io/plotting/regime_map_plot.py"  = ["T201"]
"tud_lbm/io/plotting/ca_theta_plot.py"    = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["tud_lbm"]
force-single-line = true
no-lines-before = ["future","standard-library","third-party","first-party","local-folder"]

# ---------------------------------------------------------------------------
# bumpversion
# ---------------------------------------------------------------------------
[tool.bumpversion]
current_version = "2026.0.1"

[[tool.bumpversion.files]]
filename = "tud_lbm/__init__.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "CITATION.cff"

[[tool.bumpversion.files]]
filename = "docs/conf.py"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["pyevtk.*", "optax.*", "moviepy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ty
# ---------------------------------------------------------------------------
[tool.ty.environment]
# This project is developed and tested on Linux, macOS, and Windows (see
# docs/notes/README.dev.md); "all" avoids sys.platform-based reachability
# analysis falsely marking platform-specific branches as unreachable dead
# code depending on which OS `ty` happens to run on.
python-platform = "all"
