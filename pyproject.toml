# see documentation, e.g.
# - https://packaging.python.org/en/latest/specifications/declaring-project-metadata/#declaring-project-metadata
# - https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
# - https://www.python.org/dev/peps/pep-0621/

[build-system]
requires = ["setuptools>=64.0.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "Sacha Szkudlarek", email = "s.b.szkudlarek@tudelft.nl" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # Install via conda for best results
  # See environment.yml for conda-based app_setup
]
description = "This is a lattice Boltzmann method package developed at Delft University of Technology."
keywords = ["LBM", " TUD", " Delft University of Technology"]
license = { file = "LICENSE" }
name = "tud_lbm"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
version = "2026.0.0a1"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "coverage", "ruff", "python-dotenv"]
publishing = ["build", "twine"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser", "sphinx-autoapi"]

[project.urls]
Repository = "https://github.com/szkuds/tud_lbm"
Issues = "https://github.com/szkuds/tud_lbm/issues"
ReadTheDocs = "https://tud_lbm.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
tud-lbm = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: Integration tests that validate end-to-end physics pipelines",
  "unit: Unit tests for individual operators",
  "conformance: Tests that verify operators satisfy protocol contracts",
]

[tool.coverage.run]
branch = true
source = ["tud_lbm"]
command_line = "-m pytest"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py38,py39,py310,py311,py312
skip_missing_interpreters = true
[testenv]
commands = pytest
extras = dev
"""

[tool.ruff]
line-length = 120
output-format = "concise"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable Pyflakes `E` and `F` codes by default.
select = ["ALL"]
ignore = [
    # --- ignores ---
    "ANN204", # Missing return type annotation for special (dunder) method
    "ANN205", # Missing return type annotation for staticmethod
    "FBT",    # Using boolean function arguments
    "TD",     # TODOs
    "FIX001", # Resolve FIXMEs
    "FIX002", # Resolve TODOs
    "PLR0913",
    "PLC0415",
    "COM812",

]
pydocstyle.convention = "google"

[tool.ruff.lint.flake8-bugbear]
# array_field is a dataclasses.field() wrapper — never produces a mutable default.
extend-immutable-calls = ["array_field"]

[tool.ruff.lint.per-file-ignores]
# Tests can ignore a few extra rules
"tests/**.py" = [
    "ANN201", # Missing return type annotation for public function
    "PT011",  # Missing `match` parameter in `pytest.raises()`
    "S101",   # Use of assert is detected
    "SLF001", # Private member access
    "INP001", # File is part of an implicit namespace package
    "S108", # Probable insecure usage of temporary file or directory
    "ANN001", # Missing type annotation for function argument
    "D103", # Missing docstring in public function
    "PLC0415",
    "ARG001",
    "PLR2004",
    "D102",
    "ARG004",
    "ARG003",
    "ANN202",
    "ANN002",
    "ANN003",
    "ARG005",
    "ARG002",
    "RUF002",
    "RUF003",
    "D100",
    "D102",
    "D104",
    "D205",
    "PLR0913",
    "TRY300",
]
# Examples are standalone scripts, not part of the package
"examples/**.py" = [
  "INP001", # File is part of an implicit namespace package
  "ANN201", # Missing return type annotation
    "ERA001",
]

"examples/minimal_example.py" = ["RUF002"]
"tud_lbm/config/simulation_config.py" = [
  "RUF009", # array_field / config_field are dataclasses.field() wrappers, not mutable defaults
]
"tud_lbm/util/plotting/__init__.py" = ["I001"]
"tud_lbm/util/plotting/base.py" = ["ARG002"]
"tud_lbm/pipeline/setup.py" = ["PLC0415", "RUF002"]
"tud_lbm/pipeline/__init__.py" = ["PLC0415"]  # was src/setup/__init__.py — verify this path
"tud_lbm/runner/parallel_runner.py" = ["PLC0415", "ARG001", "LOG015", "G004"]
"tud_lbm/operators/protocols.py" = ["ANN401", "RUF002"]
"tud_lbm/operators/macroscopic/_multiphase.py" = ["RUF002", "RUF003"]
"tud_lbm/operators/collision/_bgk.py" = ["RUF002"]
"tud_lbm/util/io.py" = ["ANN002"]
"tud_lbm/pipeline/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["tud_lbm"]
force-single-line = true
no-lines-before = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.bumpversion]
current_version = "0.0.2"

[[tool.bumpversion.files]]
filename = "src/__init__.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "CITATION.cff"

[[tool.bumpversion.files]]
filename = "docs/conf.py"
