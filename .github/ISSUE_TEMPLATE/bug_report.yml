name: Bug report
description: Report unexpected behaviour, a crash, or an incorrect result
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        Before you continue, please
        [search the existing issues](https://github.com/szkuds/TUD_LBM/issues?q=is%3Aissue)
        to check whether someone has already reported this.

        **Do not use this form for security vulnerabilities** — see
        [SECURITY.md](https://github.com/szkuds/TUD_LBM/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behaviour you saw and the behaviour you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: >
        The commands you ran, and the configuration you ran them with. A minimal TOML
        configuration that triggers the problem is the most useful thing you can provide.
      render: shell
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or error output
      description: Paste the full traceback if the run failed. Leave blank if it did not.
      render: python
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: TUD-LBM version or commit SHA
      description: >
        Output of `uv run python -c "import src; print(src.__version__)"`, or the
        commit SHA if you are running from a checkout.
      placeholder: "2026.0.1 or 19af9e9"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.14.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Key dependency versions
      description: >
        Output of `uv pip list | grep -Ei "jax|numpy|scipy|matplotlib"`. JAX version and
        backend (CPU/GPU) are especially useful.
      render: shell
    validations:
      required: false
